services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: retaildesk
      POSTGRES_PASSWORD: retaildesk
      POSTGRES_DB: retaildesk
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    environment:
      # Inside the compose network the host is the service name "db".
      DATABASE_URL: postgresql://retaildesk:retaildesk@db:5432/retaildesk
      SECRET_KEY: docker-demo-secret-change-me
      ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - db
    # Seed the demo data once the DB accepts connections (seed is idempotent:
    # it exits quietly if the demo data already exists).
    command: >
      sh -c "python -c \"import time; time.sleep(5)\" &&
             python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
